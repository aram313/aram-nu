<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0B22">
  <meta name="robots" content="noindex">
  <title>Kalender – redigér</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <img class="bar-logo" src="logo.png" alt="TimeOut">
      <nav class="bar-actions" id="barActions" hidden>
        <a class="bar-link" href="index.html" target="_blank" rel="noopener">Se TV-visning</a>
        <button class="bar-link" id="logoutBtn" type="button">Log ud</button>
      </nav>
    </div>
  </header>

  <div class="wrap">
    <div class="demo-note" id="demoNote" hidden>
      <strong>Demo-tilstand.</strong> Ændringer gemmes kun i denne browser. Når Supabase er sat op (se VEJLEDNING), virker alt rigtigt – også på TV'et.
    </div>

    <main id="loginView" hidden>
      <form id="loginForm" class="login-card" novalidate>
        <h1>Log ind</h1>
        <p class="muted">Log ind for at rette i klubbens kalender.</p>
        <label class="field"><span>E-mail</span>
          <input type="email" id="email" autocomplete="username" required></label>
        <label class="field"><span>Adgangskode</span>
          <input type="password" id="password" autocomplete="current-password" required></label>
        <p class="error" id="loginError" hidden></p>
        <button class="btn primary block" type="submit" id="loginBtn">Log ind</button>
      </form>
    </main>

    <main id="mainView" hidden>
      <div class="seg" role="tablist">
        <button class="seg-btn on" type="button" role="tab" data-tab="upcoming" aria-selected="true">Kalender</button>
        <button class="seg-btn" type="button" role="tab" data-tab="series" aria-selected="false">Faste begivenheder</button>
      </div>
      <section id="upcoming"></section>
      <section id="series" hidden></section>
    </main>
  </div>

  <button class="fab" id="addBtn" type="button" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Ny begivenhed
  </button>

  <div class="overlay" id="overlay" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="shared.js"></script>
  <script src="admin.js"></script>
</body>
</html>
