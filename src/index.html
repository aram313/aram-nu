<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="description" content="aram – khabar.nu, laserscanning, as-built og scan til bim, 3d print">
<title>aram</title>
<!-- the picture and words a shared link shows -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://aram.nu/">
<meta property="og:title" content="aram">
<meta property="og:description" content="laserscanning, as-built og scan til bim, 3d print">
<meta property="og:image" content="https://aram.nu/img/del.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="en stålbro tegnet som scanningspunkter på sort">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: #8c8c8c;
    --line: #1f1f1f;
  }
  html { background: var(--bg); touch-action: manipulation; }   /* no double-tap zoom */
  body {
    margin: 0;
    min-height: 100svh;
    background: var(--bg);
    color: var(--fg);
    /* each device's own clean sans: SF on Apple, Segoe on Windows, Roboto on Android */
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
    font-weight: 300;
    font-size: 15px;
    line-height: 1.6;
    letter-spacing: 0.01em;
    text-transform: lowercase;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  /* everything sits high on the page and fits a phone's screen without scrolling */
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + max(3vh, 12px)) 24px calc(env(safe-area-inset-bottom, 0px) + 20px);
  }
  h1, h2, h3, p, ol { margin: 0; font-weight: inherit; font-size: inherit; }
  a { color: inherit; text-decoration: none; }

  /* the name stays for screen readers and search, not on the page */
  h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  section { padding: 20px 0; border-top: 1px solid var(--line); }
  section:first-of-type { border-top: 0; }
  .sub { color: var(--dim); margin-top: 4px; }
  h2 a::after { content: " ↗"; color: var(--dim); }
  @media (hover: hover) { h2 a:hover, .sub a:hover, .rows button:hover { opacity: 0.7; } }

  /* the khabar line arrives quietly once fetched */
  #news { min-height: 1.6em; opacity: 0; transition: opacity 0.9s ease; }
  #news.shown { opacity: 1; }

  /* the projects: one line each with a small live miniature; a tap plays its story on the whole screen */
  .rows { margin-top: 4px; position: relative; }
  .rows canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .rows button {
    display: block; width: 100%; padding: 0 0 0 46px; margin: 0; border: 0; background: none; cursor: pointer;
    font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--fg); text-align: left;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box;
  }
  .rows button span { color: var(--dim); margin-left: 10px; }
  .rows button:focus-visible { outline: 1px solid var(--dim); outline-offset: 2px; }

  .tiles {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 16px;
  }
  .tiles button {
    padding: 0; border: 0; background: #111; cursor: zoom-in;
    aspect-ratio: 1; overflow: hidden; border-radius: 2px;
  }
  .tiles img { width: 100%; height: 100%; display: block; object-fit: cover; }

  /* opened tile or project: alone on black, tap anywhere to close */
  dialog {
    padding: 0; border: 0; max-width: none; max-height: none;
    width: 100vw; height: 100svh; background: var(--bg); color: var(--fg);
    opacity: 0; transition: opacity 0.25s ease;
  }
  dialog[open] { opacity: 1; display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
  dialog::backdrop { background: var(--bg); }
  dialog img { max-width: min(92vw, 92svh); max-height: 92svh; border-radius: 2px; }

  #play[open] { display: block; overflow: hidden; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #play::after {   /* a quiet shade under the words, so the lines behind never fight them */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.55) 20%, rgba(0, 0, 0, 0) 42%);
  }
  .cap {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; box-sizing: border-box;
    max-width: 560px; margin: 0 auto; padding: 0 24px max(7vh, 36px);
  }
  .cap .meta { color: var(--dim); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .beats { list-style: none; padding: 0; margin-top: 14px; position: relative; min-height: 3.2em; }
  .beats li { position: absolute; left: 0; top: 0; right: 0; opacity: 0; transition: opacity 0.5s ease; }
  .beats li.on { opacity: 1; }
  .labels span {   /* a word on the drawing (a measure, a name), centred where the player puts it */
    position: absolute; left: 0; top: 0; z-index: 1; color: var(--dim); font-size: 12px; white-space: nowrap;
    pointer-events: none; opacity: 0; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 3px #000, 0 0 7px #000;   /* readable over lines and the damage's coloured points */
  }
  .run { position: relative; overflow: hidden; height: 1px; margin-top: 14px; background: var(--line); }
  .run i { display: block; height: 1px; background: var(--fg); transform-origin: left; transform: scaleX(0); }
  /* while a story's data is still on its way, a faint light runs along the line */
  #play.wait .run::after {
    content: ""; position: absolute; left: 0; top: 0; width: 24%; height: 1px; background: var(--fg); opacity: 0.45;
    animation: wait 1.3s ease-in-out infinite;
  }
  @keyframes wait { from { transform: translateX(-100%); } to { transform: translateX(420%); } }
  @media (prefers-reduced-motion: reduce) {
    #news, dialog, .beats li { transition: none; }
    .beats li { position: static; opacity: 1; }
    #play.wait .run::after { animation: none; opacity: 0.2; width: 100%; }
  }
</style>
</head>
<body>
<main>
  <h1>aram</h1>

  <section>
    <h2><a href="https://khabar.nu">khabar.nu</a></h2>
    <p class="sub"><a id="news" href="https://khabar.nu"></a></p>
  </section>

  <section>
    <h2>projekter</h2>
    <div class="rows" id="rows"></div>
  </section>

  <section>
    <h2>3d print</h2>
    <div class="tiles" id="tiles"></div>
  </section>
</main>

<dialog id="view"><img alt=""></dialog>
<dialog id="play" aria-labelledby="play-name">
  <canvas id="stage" aria-hidden="true"></canvas>
  <div class="labels" id="play-labels" aria-hidden="true"></div>
  <div class="cap">
    <h3 id="play-name"></h3>
    <p class="meta" id="play-meta"></p>
    <ol class="beats" id="play-beats"></ol>
    <div class="run"><i id="play-run"></i></div>
  </div>
</dialog>

<script>
  // The day's news in one line: the lede the Khabar editor writes for khabar.nu's front page.
  const FRONT = 'https://raw.githubusercontent.com/aram313/nyhedsradar/digest/front.json';
  const news = document.getElementById('news');

  async function loadNews() {
    try {
      const r = await fetch(FRONT, { cache: 'no-cache' });
      const lede = ((await r.json()).lede || '').trim();
      if (lede && lede !== news.textContent) news.textContent = lede;
    } catch (e) { /* keep whatever is showing */ }
    if (!news.textContent) news.textContent = 'dagens nyheder';
    news.classList.add('shown');
  }
  loadNews();
  setInterval(loadNews, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadNews(); });

  // The kufi tiles, in the order of the photos in img/ (see scripts/prepare-images.py).
  const SHAHADA = 'lā ilāha illā llāh';
  const RASUL = 'muḥammadun rasūlu llāh';
  const TILES = [
    ['sort', SHAHADA, 'sort'], ['rasul-sort', RASUL, 'sort'],
    ['roed', SHAHADA, 'rød'], ['sort-paa-sand', SHAHADA, 'sort på sand'],
  ];
  const grid = document.getElementById('tiles');
  const view = document.getElementById('view');
  const big = view.querySelector('img');

  for (const [name, text, colour] of TILES) {
    const b = document.createElement('button');
    const alt = `${text} i firkantet kufi, 3d-printet, ${colour}`;
    b.setAttribute('aria-label', alt);
    b.innerHTML = `<img src="img/${name}-s.jpg" alt="${alt}" loading="lazy" decoding="async" width="480" height="480">`;
    b.addEventListener('click', () => {
      big.src = `img/${name}-l.jpg`;
      big.alt = alt;
      view.showModal();
    });
    grid.append(b);
  }
  view.addEventListener('click', () => view.close());

  // No zoom: Safari ignores user-scalable=no, so pinches are stopped here as well.
  for (const t of ['gesturestart', 'gesturechange']) document.addEventListener(t, (e) => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
</script>

<script src="stage.js"></script>
</body>
</html>
